name: Deploy

# ---------------------------------------------------------------------------
# Sprint 15.4 - CI/CD deploy stage + smoke tests + rollback (ADR-014).
#
# This workflow deploys the whole platform to an EPHEMERAL Kind cluster created
# fresh for each run (throwaway; deleted when the job ends). It is the gated
# "docker push -> kubectl/helm apply -> smoke -> (rollback on failure)" tail of
# the ADR-014 pipeline. The image build+push itself lives in ci.yml (task 15.1.2).
#
# ORDER GUARANTEE (deploy runs only AFTER images exist):
#   * workflow_run on the "CI" workflow, gated to conclusion == success, so the
#     images for the changed services have already been pushed to GHCR before a
#     deploy can start. `github.event.workflow_run.head_sha` is the exact commit
#     CI built, so the sha-<12> tag we deploy matches what CI published.
#   * workflow_dispatch lets an operator redeploy a chosen tag on demand.
#
# APPROVAL GATE:
#   The job binds to the `ephemeral-kind` GitHub Environment. Configure that
#   Environment with "Required reviewers" in repo settings so every deploy waits
#   for a human approval before it runs (ADR-014 gated delivery). No approval
#   rule on the Environment => it runs unattended (still only after a green CI).
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: sha-<12> of the target commit)"
        required: false
        default: ""

# Least privilege: read source + pull the private GHCR images. No write anywhere.
permissions:
  contents: read
  packages: read

# Never run two deploys against the (conceptual) same target at once, and never
# cancel a deploy mid-flight - a half-applied rollout is worse than a queued one.
concurrency:
  group: deploy-master
  cancel-in-progress: false

env:
  NAMESPACE: telco
  # ingress-nginx "kind" provider manifest, pinned for reproducibility.
  INGRESS_NGINX_REF: controller-v1.11.3
  # metrics-server, pinned; patched with --kubelet-insecure-tls for Kind.
  METRICS_SERVER_REF: v0.7.2
  PULL_SECRET: ghcr-pull

jobs:
  deploy:
    name: Deploy to ephemeral Kind
    runs-on: ubuntu-latest
    # Deploy ONLY after a successful CI run (images pushed) or an explicit dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment: ephemeral-kind
    steps:
      - name: Resolve target commit
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target commit: $SHA" >&2

      - name: Checkout target commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Compute image coordinates
        id: img
        run: |
          set -euo pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="sha-$(echo "${{ steps.target.outputs.sha }}" | cut -c1-12)"
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Deploying ghcr.io/$OWNER/telco-<service>:$TAG" >&2

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Create ephemeral Kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/kind/kind-cluster.yaml
          cluster_name: telco-ci

      # Feature 19.4 (ADR-026 Section 3): deploy/kind/kind-cluster.yaml disables
      # Kind's default CNI (kindnetd), which does not enforce Kubernetes
      # NetworkPolicy at all - the platform's default-deny NetworkPolicy
      # baseline and per-service allow rules would be silent no-ops under it.
      # Calico is installed here in its place, matching the local Kind
      # verification procedure in deploy/RUNBOOK.md, so this CI deploy job
      # actually exercises NetworkPolicy enforcement rather than accepting it
      # as inert.
      - name: Install Calico CNI (NetworkPolicy enforcement, ADR-026 Section 3)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/calico.yaml \
            "https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml"
          sed -i 's/# - name: CALICO_IPV4POOL_CIDR/- name: CALICO_IPV4POOL_CIDR/; s/#   value: "192.168.0.0\/16"/  value: "10.244.0.0\/16"/' /tmp/calico.yaml
          kubectl apply -f /tmp/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
          kubectl -n kube-system rollout status deployment/calico-kube-controllers --timeout=180s

      - name: Install ingress-nginx (Kind provider)
        run: |
          set -euo pipefail
          kubectl apply -f \
            "https://raw.githubusercontent.com/kubernetes/ingress-nginx/${INGRESS_NGINX_REF}/deploy/static/provider/kind/deploy.yaml"
          kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=300s
          kubectl -n ingress-nginx wait --for=condition=Ready pod \
            -l app.kubernetes.io/component=controller --timeout=300s

      - name: Install metrics-server (HPA metrics; --kubelet-insecure-tls for Kind)
        run: |
          set -euo pipefail
          kubectl apply -f \
            "https://github.com/kubernetes-sigs/metrics-server/releases/download/${METRICS_SERVER_REF}/components.yaml"
          # Kind's kubelet serves a self-signed cert; allow metrics-server to trust it.
          kubectl -n kube-system patch deployment metrics-server --type=json -p \
            '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deploy/metrics-server --timeout=300s

      - name: Create namespace and GHCR image pull secret
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          # Kind must authenticate to GHCR to pull the private telco-* images.
          # GITHUB_TOKEN carries packages:read for images owned by this repo/org.
          kubectl -n "$NAMESPACE" create secret docker-registry "$PULL_SECRET" \
            --docker-server=ghcr.io \
            --docker-username='${{ github.actor }}' \
            --docker-password='${{ secrets.GITHUB_TOKEN }}'

      - name: Deploy stateful dependencies
        run: |
          set -euo pipefail
          # NOTE: no --wait here. The chart has a MinIO bucket-create POST-INSTALL
          # HOOK (Job) that helm always blocks on, so the long --timeout covers it.
          # We deliberately do NOT --wait on every workload: schema-registry is a
          # tracked follow-up (it currently exits 1 at the Confluent "Configuring"
          # stage), and --wait would hang on it. We wait explicitly on the CORE
          # deps the services actually need, below.
          #
          # networkPolicy.enabled=false: the default-deny baseline's only allow
          # rules open port 4143 (the Linkerd mesh proxy's inbound port) - this
          # ephemeral Kind cluster never installs Linkerd (no such step in this
          # workflow), so nothing here is meshed and nothing ever listens on
          # 4143. Under default-deny with those rules, ALL pod-to-pod backend
          # traffic is blocked regardless, including minio-createbuckets's
          # direct connection to minio:9000 (its post-install hook Job, which
          # is not a telco-service release and gets no egress-allow rule at
          # all) - it hangs at "waiting for minio..." for the full --timeout
          # every run, confirmed via kubectl logs/describe. NetworkPolicy
          # enforcement is a production/meshed-environment concern (ADR-026);
          # this smoke-test cluster's job is verifying the app charts deploy
          # and become healthy, not re-proving the mesh policy - production
          # deploys (where Linkerd is actually installed) keep it enabled.
          #
          # observability.enabled=false: skips otel-collector/tempo/loki/
          # prometheus/grafana (5 fewer pods, ~250m fewer CPU requests) -
          # mirrors infra/docker/compose.yml, where the same 5 components are
          # already an opt-in `observability` profile, not part of the default
          # local-dev stack. This cluster's total CPU *requests* across every
          # dependency + all 13 app services (even at 1 replica each, see
          # autoscaling.enabled=false below) exceed what a single-node Kind
          # cluster on a shared GitHub-hosted runner can schedule - live-
          # verified: 10 of 16 app pods stuck Pending ("Insufficient cpu")
          # once observability + every backend + the first ~6 services were
          # already running. This is one of two levers pulled together to fit
          # (see the resources.requests.cpu override below); production
          # deploys keep the full observability stack.
          helm upgrade --install telco-deps deploy/helm/dependencies \
            -n "$NAMESPACE" \
            --set createNamespace=false \
            --set networkPolicy.enabled=false \
            --set observability.enabled=false \
            --timeout 20m

      - name: Wait for core dependencies
        run: |
          set -euo pipefail
          # schema-registry is intentionally excluded (tracked follow-up). Every
          # dep pod carries app.kubernetes.io/name=<component>, so one selector
          # covers both StatefulSet and Deployment backed deps.
          for dep in postgres redis mongo kafka keycloak minio; do
            echo "Waiting for dependency: $dep" >&2
            kubectl -n "$NAMESPACE" wait --for=condition=Ready pod \
              -l "app.kubernetes.io/name=${dep}" --timeout=600s
          done

      - name: Deploy platform services
        env:
          OWNER: ${{ steps.img.outputs.owner }}
          TAG: ${{ steps.img.outputs.tag }}
        run: |
          set -euo pipefail

          install_service() {
            svc="$1"
            echo "==> helm upgrade --install $svc (tag $TAG)" >&2
            # networkPolicy.enabled=false: matches the dependencies chart's own
            # override above - this chart's default-deny-compatible allow rules
            # are equally mesh-only (port 4143), and this cluster has no mesh.
            #
            # linkerdCRDsInstalled=false: this chart also renders Server/
            # AuthorizationPolicy/MeshTLSAuthentication (policy.linkerd.io CRD
            # resources) - applying those where Linkerd's CRDs were never
            # installed fails Helm outright ("no matches for kind Server in
            # version policy.linkerd.io/v1beta1"), not something
            # meshPolicy.enabled alone can suppress (it deliberately does NOT
            # gate the Server object - see values.yaml's linkerdCRDsInstalled
            # comment for why that's a separate, orthogonal flag).
            #
            # autoscaling.enabled=false: the chart's default HPA (minReplicas:
            # 2, 250m CPU request per pod) needs 2 * 13 services = 26 app pods
            # scheduled immediately on top of every stateful dependency - live-
            # verified this exceeds a single-node Kind cluster's allocatable
            # CPU on a GitHub-hosted runner (a second api-gateway replica sat
            # Pending: "Insufficient cpu" until the rollout-status wait timed
            # out at 600s). One replica per service is enough for a smoke test;
            # production deploys keep autoscaling enabled.
            #
            # resources.requests.cpu: even at 1 replica each (no HPA), 13
            # services * the chart's default 250m request = 3.25 vCPU, plus
            # ~700m for the backend dependencies (observability disabled
            # above) - still more than a single-node Kind cluster on a shared
            # GitHub-hosted runner can schedule (live-verified: order-service,
            # 7th in the install order, sat Pending on "Insufficient cpu" with
            # only 6 of 13 app pods running at 250m/service). 130m (down from
            # 250m) fits all 13 with headroom to spare - live-verified at
            # 100m first (too aggressive, see below), then 130m. `requests`
            # gates scheduling admission; `limits.cpu` (the chart's default
            # 500m) is untouched, so a pod can still burst above this once
            # scheduled if the node has spare cycles. Combined with
            # observability.enabled=false above, this is one of three levers
            # pulled together to fit the platform on one CI node; production
            # deploys keep the chart's default request.
            #
            # probes.startup.failureThreshold=45: under REAL node contention
            # (not just scheduling admission), `requests.cpu` also sets the
            # cgroup's proportional CPU share (CFS shares) - a low request
            # gets meaningfully less wall-clock CPU than the chart's default
            # once every pod on the node is actually competing for cycles,
            # not just less priority for being scheduled at all. Live-
            # verified at 100m: identity-service scheduled and started fine
            # but was killed and restarted 3 times by the chart's default
            # startup probe budget (10s + 10s*30 = ~5 min) before it finished
            # booting under that throttling. 45 (~7.7 min) stays under the
            # rollout-status --timeout=600s below with margin, and under
            # Kubernetes' own Deployment progressDeadlineSeconds (600s
            # default, not overridden by this chart). Kept even after raising
            # the CPU request to 130m, as a safety margin against slower
            # startup under contention - a smoke test can afford to wait
            # longer; production deploys keep the chart's default budget.
            helm upgrade --install "$svc" deploy/helm/telco-service \
              -n "$NAMESPACE" \
              -f "deploy/helm/values/${svc}.yaml" \
              --set image.registry=ghcr.io \
              --set "image.owner=${OWNER}" \
              --set "image.tag=${TAG}" \
              --set "imagePullSecrets[0].name=${PULL_SECRET}" \
              --set networkPolicy.enabled=false \
              --set linkerdCRDsInstalled=false \
              --set autoscaling.enabled=false \
              --set resources.requests.cpu=130m \
              --set probes.startup.failureThreshold=45
          }

          # config-server first (every other service bootstraps its config from it),
          # then discovery-server (Eureka), then the domain services + the gateway.
          install_service config-server
          kubectl -n "$NAMESPACE" rollout status deploy/config-server --timeout=600s

          install_service discovery-server
          kubectl -n "$NAMESPACE" rollout status deploy/discovery-server --timeout=600s

          REST="api-gateway identity-service customer-service product-catalog-service \
                order-service subscription-service usage-service billing-service \
                payment-service notification-service ticket-service campaign-service \
                dispute-service fraud-service"
          for svc in $REST; do
            install_service "$svc"
          done

          # Rolling deploys use maxUnavailable:0, so rollout status only goes green
          # once the new pods are Ready. A bad image => this blocks then fails, which
          # (like a smoke failure) drops into the rollback step below.
          for svc in $REST; do
            echo "==> rollout status $svc" >&2
            kubectl -n "$NAMESPACE" rollout status deploy/"$svc" --timeout=600s
          done

      - name: Smoke tests
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          GATEWAY_URL: http://localhost:18080
          INGRESS_HOST: telco.local
        run: |
          set -euo pipefail
          chmod +x deploy/smoke/smoke-test.sh
          ./deploy/smoke/smoke-test.sh

      - name: Rollback on failure
        if: failure()
        run: |
          set -uo pipefail
          echo "::group::Deploy/smoke failed - attempting rollback" >&2
          RELEASES="config-server discovery-server api-gateway identity-service \
            customer-service product-catalog-service order-service subscription-service \
            usage-service billing-service payment-service notification-service ticket-service \
            campaign-service dispute-service fraud-service"
          for rel in $RELEASES; do
            # Only a release with a prior revision can be rolled back. On this
            # EPHEMERAL cluster the first deploy is revision 1, so there is nothing
            # to revert to; the failing release is left in place for diagnostics
            # (the cluster is torn down at job end anyway). On a PERSISTENT target
            # this reverts each release to its last good revision - see
            # deploy/ROLLBACK.md for the live-proven procedure and evidence.
            REVS="$(helm -n "$NAMESPACE" history "$rel" -o json 2>/dev/null \
                    | jq 'length' 2>/dev/null || echo 0)"
            if [ "${REVS:-0}" -ge 2 ]; then
              echo "Rolling back $rel (had $REVS revisions)" >&2
              helm -n "$NAMESPACE" rollback "$rel" || \
                echo "WARN: helm rollback $rel failed" >&2
            else
              echo "No prior revision for $rel (revision ${REVS:-0}); nothing to roll back" >&2
            fi
          done
          echo "::endgroup::" >&2

      - name: Cluster diagnostics
        if: always()
        run: |
          set +e
          echo "::group::Pods"
          kubectl -n "$NAMESPACE" get pods -o wide
          echo "::endgroup::"
          echo "::group::Helm releases"
          helm -n "$NAMESPACE" list -a
          echo "::endgroup::"
          echo "::group::Recent events"
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -50
          echo "::endgroup::"
          # Container logs for every non-Ready pod - the events dump above is
          # tail'd to 50 lines total across the whole namespace, so a crashing
          # pod's own reason (stack trace, OOMKilled, config error) is easily
          # cut off by other pods' events. --previous captures the last
          # terminated instance's logs, which is where a crash-loop's actual
          # failure reason lives (the CURRENT instance may not have logged
          # anything relevant yet).
          echo "::group::Logs for non-Ready pods"
          for pod in $(kubectl -n "$NAMESPACE" get pods --no-headers | awk '{split($2,r,"/"); if (r[1] != r[2]) print $1}'); do
            echo "--- $pod (current) ---"
            kubectl -n "$NAMESPACE" logs "$pod" --tail=100
            echo "--- $pod (previous, if any) ---"
            kubectl -n "$NAMESPACE" logs "$pod" --previous --tail=100 2>&1
          done
          echo "::endgroup::"
