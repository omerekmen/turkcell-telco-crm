name: Update Parent Repository

on:
  push:
    branches:
      - master

jobs:
  update-parent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v7
        with:
          repository: omerekmen/turkcell-gygy-java
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          submodules: recursive

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update submodule
        run: |
          git submodule update \
            --init \
            --remote \
            telco-crm

      - name: Build commit message
        id: msg
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A random per-run delimiter (not a fixed "EOF") avoids collision if the
          # commit message itself ever contains a line matching the delimiter, and
          # passing the message via the env block above (rather than templating it
          # directly into this script) avoids both that collision class of bug and
          # shell/injection risk from arbitrary commit message content (quotes,
          # backticks, $(...), multiple lines) - a long, multi-line squash-merge
          # commit message broke the previous fixed-"EOF" + direct-templating
          # version outright ("Invalid value. Matching delimiter not found 'EOF'").
          delimiter="$(openssl rand -hex 8)"
          {
            echo "message<<${delimiter}"
            echo "chore: update telco-crm submodule"
            echo ""
            echo "$HEAD_COMMIT_MESSAGE"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        env:
          COMMIT_MESSAGE: ${{ steps.msg.outputs.message }}
        run: |
          git add telco-crm

          git diff --cached --quiet && exit 0

          git commit -m "$COMMIT_MESSAGE"

      - name: Push changes
        run: |
          git push origin master
 
