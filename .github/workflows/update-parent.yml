name: Update Parent Repository

on:
  push:
    branches:
      - master

jobs:
  update-parent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          repository: omerekmen/turkcell-gygy-java
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          submodules: recursive

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update submodule
        run: |
          git submodule update \
            --init \
            --remote \
            telco-crm

      - name: Build commit message from submodule changes
        id: commitmsg
        run: |
          cd telco-crm

          # Get last commit (or range if needed)
          COMMITS=$(git log --pretty=format:"- %s" -n 10)

          cd ..

          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "chore: update telco-crm submodule" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "telco-crm recent changes:" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Push changes
        run: |
          git push origin master
 
